<div class="toast-container" *ngIf="mensaje" [ngClass]="mensaje.tipo">

  <div class="toast-icon">
    <svg *ngIf="mensaje.tipo === 'success'" viewBox="0 0 24 24" width="24" height="24">
      <path fill="currentColor"
        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
    </svg>
    <svg *ngIf="mensaje.tipo === 'error'" viewBox="0 0 24 24" width="24" height="24">
      <path fill="currentColor"
        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
    </svg>
    <svg *ngIf="mensaje.tipo === 'info'" viewBox="0 0 24 24" width="24" height="24">
      <path fill="currentColor"
        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
    </svg>
  </div>

  <div class="toast-content">
    {{ mensaje.texto }}
  </div>

  <button class="toast-close" (click)="cerrar()">
    <svg viewBox="0 0 24 24" width="16" height="16">
      <path fill="currentColor"
        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
    </svg>
  </button>
</div>
