<main class="perfil-container">
  <div class="perfil-header">
    <h2>Información Personal</h2>
    <p>Administra tu información y personaliza tu foto de perfil.</p>
  </div>

  <div class="perfil-layout">

    <div class="avatar-section">
      <div class="avatar-wrapper">
        <img
          [src]="usuario.avatar || 'https://ui-avatars.com/api/?name=' + usuario.nombre + '&background=2d3748&color=fff'"
          alt="Avatar" class="avatar-img">

        <label class="avatar-edit-btn" title="Cambiar Foto">
          
          <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden>
        </label>
      </div>
      <h3>{{ usuario.nombre }}</h3>
      <p class="rol-tag">Miembro Activo</p>
    </div>

    <div class="form-section">
      <form (ngSubmit)="guardarCambios()">

        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" [(ngModel)]="usuario.nombre" name="nombre" required placeholder="Ej. Juan Pérez">
        </div>

        <div class="form-group">
          <label>Correo Electrónico (No modificable)</label>
          <input type="email" [(ngModel)]="usuario.email" name="email" disabled class="input-disabled">
          <small>El correo está vinculado a tus compras, contacta a soporte para cambiarlo.</small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-guardar" [disabled]="guardando">
            {{ guardando ? 'Guardando en la bóveda...' : 'Guardar Cambios' }}
          </button>
        </div>
      </form>
    </div>

  </div>
</main>
